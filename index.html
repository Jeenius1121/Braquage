<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Braquage</title>
<!-- installable comme une appli (iPhone : « Sur l'écran d'accueil » ; Android : « Ajouter à l'écran d'accueil ») -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="theme-color" content="#111014">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Braquage">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111014; --panel:#1c1b21; --panel2:#26242d; --ink:#f1ede4; --muted:#a29d92; --line:#36333d;
  --or:#e8b04a; --or-fonce:#3a2f1a; --rouge:#e5484d; --rouge-fond:#3a1a1c; --vert:#3ecf8e; --vert-fond:#16302a; --bleu:#6aa8ff;
  --papier:#ece3cf; --papier-ink:#2a241a;
  color-scheme:dark; box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%; overflow-x:hidden}
body{margin:0; min-height:100vh; min-height:100svh; color:var(--ink); font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.45;
  background:var(--bg) radial-gradient(120% 70% at 50% -10%, #3a2a14 0%, #1a1712 45%, var(--bg) 80%) no-repeat; -webkit-tap-highlight-color:transparent}
body::before{content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; background:repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 2px, transparent 2px 5px)}
main{max-width:560px; margin:0 auto; padding:12px 16px calc(24px + env(safe-area-inset-bottom,0px))}
button{font:inherit; color:inherit; -webkit-user-select:none; user-select:none; cursor:pointer}
button:disabled{cursor:not-allowed}
h1,h2,h3{margin:0}
.titre{font-family:"Anton",Impact,"Arial Black",sans-serif; font-weight:400; letter-spacing:.02em; text-transform:uppercase}
.dossier{font-family:"Special Elite","Courier New",monospace}
.muet{color:var(--muted)}
.petit{font-size:.86rem}

/* ===== barre du haut : argent, notoriété, coup ===== */
.barre{position:sticky; top:0; z-index:5; background:rgba(17,16,20,.92); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px}
.barre .dedans{max-width:560px; margin:0 auto; display:flex; align-items:center; gap:10px}
.barre .logo{font-size:1.25rem; color:var(--or); flex:1; min-width:0}
.barre .argent{font-weight:800; font-size:1.05rem; color:var(--vert); font-variant-numeric:tabular-nums}
.barre .niveau{color:var(--or); font-size:.9rem; white-space:nowrap}
.barre .menu{background:none; border:1px solid var(--line); border-radius:10px; padding:4px 10px; color:var(--muted)}

/* bandeau de mise à jour */
.maj{position:sticky; top:0; z-index:6; display:flex; gap:10px; align-items:center; background:var(--or); color:#1a1408; padding:10px 16px; font-weight:600; font-size:.92rem}
.maj span{flex:1}
.maj button{background:#1a1408; color:var(--or); border:0; border-radius:10px; padding:8px 12px; font-weight:800}

/* ===== éléments communs ===== */
.carte{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; margin:12px 0}
.btn{display:block; width:100%; padding:14px 16px; border-radius:12px; border:0; font-weight:800; font-size:1rem; background:var(--or); color:#1a1408; margin-top:10px; text-align:center}
.btn:disabled{opacity:.4}
.btn.secondaire{background:transparent; border:1px solid var(--line); color:var(--ink); font-weight:600}
.btn.danger{background:var(--rouge); color:#fff}
.etoiles{color:var(--or); letter-spacing:1px; white-space:nowrap}
.etoiles .vide{color:#4a463f}
.badge{display:inline-block; font-size:.75rem; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--panel2); color:var(--muted); border:1px solid var(--line)}
.badge.or{background:var(--or-fonce); color:var(--or); border-color:#5a4826}
.badge.rouge{background:var(--rouge-fond); color:#ff8a8d; border-color:#5a2a2d}
.badge.vert{background:var(--vert-fond); color:var(--vert); border-color:#245544}
.prix{font-weight:800; font-size:1.15rem; font-variant-numeric:tabular-nums}
.trop-cher{color:var(--rouge)}
.stat{display:grid; grid-template-columns:96px 1fr; align-items:center; gap:8px; font-size:.82rem; color:var(--muted); margin:3px 0}
.jauge{height:7px; border-radius:4px; background:#2f2c35; overflow:hidden}
.jauge i{display:block; height:100%; background:var(--or); border-radius:4px}
.jauge.rouge i{background:var(--rouge)}
.jauge.vert i{background:var(--vert)}
.efficacite{margin-top:10px}
.efficacite .ligne{display:flex; justify-content:space-between; font-size:.85rem; color:var(--muted); margin-bottom:4px}
.efficacite .ligne b{color:var(--ink)}
.efficacite .jauge{height:10px}
.chances summary{cursor:pointer}
.stat.chance{grid-template-columns:1fr 90px 44px; font-size:.86rem}
.stat.chance b{color:var(--ink); text-align:right; font-variant-numeric:tabular-nums}
.offre.vide .objet-icone{background:transparent; border:1px dashed var(--line)}
.offre.vide .consequence{color:#ffb3b5; font-size:.9rem; margin-top:8px}
ul.liste{margin:6px 0 0; padding-left:18px}
ul.liste li{margin:2px 0}

/* ===== accueil ===== */
.accueil{text-align:center; padding-top:8vh}
.accueil h1{font-size:clamp(3.2rem,18vw,5rem); line-height:.95; color:var(--or); text-shadow:0 4px 0 #6b4a12, 0 10px 30px rgba(0,0,0,.6)}
.accueil .sous{color:var(--muted); margin:10px 0 26px}
.regles{text-align:left}
.regles p{margin:6px 0}

/* ===== cibles ===== */
.cible h3{font-size:1.3rem; margin:4px 0 2px}
.cible .lieu{color:var(--muted); font-size:.9rem}
.cible .butin{display:flex; justify-content:space-between; align-items:baseline; margin:10px 0 6px; padding:8px 10px; border-radius:10px; background:var(--vert-fond)}
.cible .butin b{color:var(--vert); font-variant-numeric:tabular-nums}
.secu{display:grid; grid-template-columns:24px 1fr; gap:4px 6px; font-size:.88rem; margin:8px 0}
.ambiance{font-style:italic; color:var(--muted); font-size:.88rem; margin-top:6px}
.cible.gros{border-color:#6b4a12; box-shadow:0 0 0 1px #6b4a12 inset}

/* ===== préparation ===== */
.resume-cible{display:flex; justify-content:space-between; gap:10px; align-items:center; font-size:.9rem; color:var(--muted)}
.resume-cible b{color:var(--ink)}
.budget{display:flex; justify-content:space-between; align-items:center; margin:8px 0 4px; padding:10px 12px; border-radius:12px; background:var(--panel); border:1px solid var(--line)}
.budget .prix{color:var(--vert)}
.points{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0}
.points button{width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--panel); font-size:1.1rem; padding:0; position:relative}
.points button.fait{border-color:#5a4826; background:var(--or-fonce)}
.points button.passe{opacity:.55}
.points button.actif{outline:2px solid var(--or); outline-offset:1px}
.etape-titre{font-size:1.6rem; color:var(--or); margin-top:6px}
.etape-desc{color:var(--muted); margin:2px 0 6px}

.offre{position:relative}
.offre.choisie{border-color:var(--or); box-shadow:0 0 0 1px var(--or) inset}
.offre .tete{display:flex; gap:12px; align-items:center}
.offre .tete canvas{width:64px; height:64px; border-radius:12px; flex:none}
.offre .nom{font-weight:800; font-size:1.08rem; line-height:1.2}
.offre .infos{color:var(--muted); font-size:.85rem}
.offre .pied{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:10px}
.offre .pied .btn{width:auto; margin:0; padding:10px 18px}
.papier{background:var(--papier); color:var(--papier-ink); border-radius:8px; padding:8px 10px; margin-top:10px; font-size:.86rem; line-height:1.4}
.papier p{margin:3px 0}
.papier .sec{font-weight:700; text-transform:uppercase; font-size:.72rem; letter-spacing:.08em; opacity:.7; margin-top:6px}
.papier ul{margin:2px 0; padding-left:16px}
.papier li{margin:2px 0}
.objet-icone{font-size:2rem; width:64px; height:64px; border-radius:12px; background:var(--panel2); display:grid; place-items:center; flex:none}
.alerte-recap{background:var(--rouge-fond); border:1px solid #5a2a2d; color:#ffb3b5; border-radius:12px; padding:8px 12px; margin:6px 0; font-size:.9rem}
.ligne-recap{display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px dashed var(--line); font-size:.93rem}
.ligne-recap:last-child{border-bottom:0}

/* ===== braquage en direct ===== */
.direct{position:sticky; top:calc(54px + env(safe-area-inset-top,0px)); z-index:4; display:flex; gap:10px; align-items:center; padding:10px 12px; border-radius:12px; background:var(--panel); border:1px solid var(--line); margin:10px 0}
.direct .temps{font-variant-numeric:tabular-nums; font-weight:800; color:var(--or); min-width:58px}
.direct .etat{flex:1; font-size:.9rem}
.direct.alerte{border-color:var(--rouge); animation:gyro 1s infinite}
@keyframes gyro{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,.0)}50%{box-shadow:0 0 18px 2px rgba(229,72,77,.45)}}
.log{list-style:none; margin:0; padding:0}
.log li{padding:8px 12px; margin:6px 0; border-radius:10px; background:var(--panel); border-left:4px solid var(--line); animation:entre .35s ease-out}
.log li.phase{background:none; border:0; padding:14px 0 2px; font-family:"Anton",Impact,sans-serif; text-transform:uppercase; letter-spacing:.04em; color:var(--or); font-size:1.15rem}
.log li.bon{border-left-color:var(--vert)}
.log li.mauvais{border-left-color:var(--rouge)}
.log li.info{border-left-color:var(--bleu); color:#cfe0ff}
@keyframes entre{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}

/* ===== bilan ===== */
.issue{text-align:center; padding:18px 12px}
.issue h2{font-size:2.2rem; line-height:1.05}
.issue.vert h2{color:var(--vert)} .issue.or h2{color:var(--or)} .issue.rouge h2{color:var(--rouge)}
.compte .ligne-recap b{font-variant-numeric:tabular-nums}
.membre{display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px dashed var(--line)}
.membre:last-child{border-bottom:0}
.membre canvas{width:48px; height:48px; border-radius:10px; flex:none}
.membre .corps{flex:1; font-size:.9rem}

footer{max-width:560px; margin:0 auto; padding:0 16px calc(20px + env(safe-area-inset-bottom,0px)); color:#6f6a62; font-size:.78rem; text-align:center}
@media (prefers-reduced-motion: reduce){ .log li{animation:none} .direct.alerte{animation:none} }
</style>
</head>
<body>
<div class="maj" id="majDispo" hidden><span id="majTexte"></span><button id="majOk">Mettre à jour</button></div>
<header class="barre" id="barre" hidden>
  <div class="dedans">
    <span class="logo titre">Braquage</span>
    <span class="niveau" id="hNiveau"></span>
    <span class="argent" id="hArgent"></span>
    <button class="menu" data-a="menu" aria-label="Menu">☰</button>
  </div>
</header>
<main id="app"></main>
<footer id="version"></footer>

<script>
"use strict";
/* ===== OUTILS ===== */
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const choix = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const melange = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const euros = n => Math.round(n).toLocaleString("fr-FR") + " €";
// arrondit un prix à un montant « rond » (1 234 → 1 250)
const arrondiPrix = x => { if (x < 100) return Math.max(10, Math.round(x / 5) * 5); const pas = Math.pow(10, Math.floor(Math.log10(x)) - 1) / 2; return Math.round(x / pas) * pas; };
const etoiles = (n, max = 5) => `<span class="etoiles">${"★".repeat(n)}<span class="vide">${"★".repeat(Math.max(0, max - n))}</span></span>`;
const jauge = (x, couleur) => `<div class="jauge${couleur === true ? " rouge" : couleur ? " " + couleur : ""}"><i style="width:${Math.round(clamp(x) * 100)}%"></i></div>`;
const MOTS_NIVEAU = ["Catastrophique", "Faible", "Moyen", "Bon", "Excellent"];
const motNiveau = s => MOTS_NIVEAU[clamp(Math.floor(s * 5), 0, 4)];
const couleurNiveau = s => s < 0.4 ? "rouge" : s < 0.65 ? "" : "vert";
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// accords masculin / féminin : « Ancien{ne} pilote, connu{e} » → « Ancienne pilote, connue »
const ACCORDS = { e: ["", "e"], ne: ["", "ne"], il: ["il", "elle"], Il: ["Il", "Elle"], lui: ["lui", "elle"], eur: ["eur", "euse"], teur: ["teur", "trice"], er: ["er", "ère"], f: ["f", "ve"], x: ["x", "se"], le: ["le", "la"], Le: ["Le", "La"], un: ["un", "une"] };
const accord = (s, sexe) => s.replace(/\{(\w+)\}/g, (m, k) => ACCORDS[k] ? ACCORDS[k][sexe === "f" ? 1 : 0] : m);

/* ===== ÉCHELLE DU JEU =====
   Tout grossit d'un facteur 2,6 par niveau de cible (1 à 8) : les prix des recrues et du matériel comme le butin.
   On commence avec de quoi monter un petit coup de village ; pour viser plus gros, il faut réinvestir ses gains. */
const NIVEAU_MAX = 8;
const PENTE = 1.8; // plus c'est haut, plus la compétence compte (et moins la chance)
const ARGENT_DEPART = 4000;
const BASE = t => 400 * Math.pow(2.6, t - 1);           // prix « normal » d'une recrue moyenne pour un coup de niveau t
const BUTIN_MOYEN = t => BASE(t) * (30 + 6 * t);        // butin moyen d'une cible de niveau t (les gros coups demandent plus de monde, ils rapportent plus)

/* Le prix demandé suit la valeur réelle… la plupart du temps.
   ~75 % : prix cohérent (±15 %) ; ~12 % : bonne affaire (moitié prix environ) ; ~13 % : arnaque (presque le double). */
function loiDuPrix(valeur) {
  const r = Math.random();
  const f = r < 0.12 ? rand(0.45, 0.75) : r < 0.25 ? rand(1.35, 1.9) : rand(0.85, 1.18);
  return { prix: arrondiPrix(valeur * f), facteur: f };
}
const verdictPrix = f => f < 0.8 ? { txt: "Bonne affaire", c: "vert" } : f > 1.3 ? { txt: "Trop cher payé", c: "rouge" } : { txt: "Prix honnête", c: "" };

/* ===== NOMS ET LIEUX (tout est généré, rien n'est tiré d'une liste de personnages) ===== */
const PRENOMS = {
  m: ["Karim", "Julien", "Mehdi", "Thomas", "Kevin", "Franck", "Sébastien", "Yanis", "Lucas", "Bruno", "Rachid", "Mathieu", "Steven", "Didier", "Nicolas", "Patrick", "Sofiane", "Jordan", "Anthony", "Olivier", "Christophe", "Moussa", "Romain", "Alexandre", "Jean-Marc", "Dimitri", "Hugo", "Ludovic", "Farid", "Grégory", "Vincent", "Cédric", "Ibrahim", "Loïc", "Tony", "Marco", "Paolo", "Sacha", "Enzo", "Gilles", "Raymond", "Jacky", "Bilal", "Quentin", "Hervé", "Fabrice", "Mamadou", "Teddy"],
  f: ["Sarah", "Nadia", "Julie", "Inès", "Camille", "Sandrine", "Laetitia", "Amandine", "Yasmine", "Léa", "Chloé", "Sabrina", "Valérie", "Emma", "Fatou", "Céline", "Manon", "Jessica", "Karine", "Océane", "Lina", "Nathalie", "Aurélie", "Leïla", "Sonia", "Clara", "Marion", "Vanessa", "Noémie", "Samia", "Josiane", "Mélissa", "Aïcha", "Romane", "Brigitte", "Kenza"]
};
const NOMS = ["Martin", "Bernard", "Dubois", "Moreau", "Lefèvre", "Garcia", "Roux", "Fontaine", "Mercier", "Benali", "Haddad", "Lambert", "Faure", "Rousseau", "Blanc", "Guérin", "Muller", "Henry", "Perrin", "Morel", "Girard", "André", "Lopez", "Fernandes", "Da Silva", "Ferreira", "Chevalier", "Gauthier", "Masson", "Marchand", "Duval", "Denis", "Lemoine", "Bertin", "Rossi", "Ricci", "Diallo", "Traoré", "Koné", "Nguyen", "Bouvier", "Carpentier", "Leroy", "Barbier", "Renaud", "Schmitt", "Brunet", "Colin", "Vidal", "Arnaud", "Picard", "Bonnet", "Caron", "Hamidi", "Mansouri", "Kowalski", "Novak", "Petrov", "Weber", "Santoni", "Lacroix", "Joly", "Poulain", "Maillard"];
const VILLES = ["Lyon", "Marseille", "Lille", "Toulouse", "Nantes", "Bordeaux", "Strasbourg", "Montpellier", "Rennes", "Reims", "Saint-Étienne", "Le Havre", "Grenoble", "Dijon", "Angers", "Nîmes", "Clermont-Ferrand", "Limoges", "Tours", "Amiens", "Metz", "Perpignan", "Besançon", "Orléans", "Rouen", "Mulhouse", "Caen", "Nancy", "Avignon", "Valence", "Brest", "Pau", "Calais", "Roubaix", "Toulon", "Nice", "Bastia", "Lens"];
const GRANDES_VILLES = ["Paris", "Lyon", "Marseille", "Nice", "Bordeaux", "Lille", "Toulouse", "Monaco"];
const VILLAGE_DEBUT = ["Saint-Julien", "Saint-Amand", "Sainte-Colombe", "Villeneuve", "Montigny", "Fontaine", "Beaumont", "Châteauneuf", "Neuville", "La Roche", "Bourg", "Montfort", "Val", "Saint-Hilaire", "Sainte-Marie", "Fresnoy", "Courtenay", "Le Mesnil", "Saint-Fargeau", "Lussac", "Vaux"];
const VILLAGE_FIN = ["-sur-Loire", "-en-Bresse", "-les-Bains", "-le-Petit", "-la-Forêt", "-sur-Marne", "-du-Lac", "-en-Vexin", "-sous-Bois", "-le-Vieux", "-sur-Sarthe", "-en-Morvan", "-les-Vignes", "-la-Rivière", "", "", ""];
const sexeAuHasard = () => chance(0.68) ? "m" : "f";
const prenom = sexe => choix(PRENOMS[sexe || sexeAuHasard()]);
const nomFamille = () => choix(NOMS);
const village = () => choix(VILLAGE_DEBUT) + choix(VILLAGE_FIN);

/* ===== CIBLES =====
   Chaque type de lieu a un niveau (1 = boutique paumée, 8 = réserve d'or) et un profil de sécurité.
   Les niveaux de sécurité vont de 0 (rien) à 5 (le maximum). */
const SECU = {
  gardes: { icone: "💂", txt: ["Personne pour surveiller", "Le patron, seul derrière le comptoir", "Un vigile", "Deux vigiles", "Une équipe de sécurité armée", "Des gardes d'élite lourdement armés"] },
  cameras: { icone: "📹", txt: ["Aucune caméra", "Une vieille caméra (peut-être fausse)", "Quelques caméras", "Vidéosurveillance complète", "Caméras reliées à un centre de contrôle", "Surveillance totale, détecteurs de mouvement"] },
  alarme: { icone: "🚨", txt: ["Pas d'alarme", "Une alarme sonore basique", "Alarme reliée à une société de télésurveillance", "Alarme silencieuse reliée à la police", "Système d'alarme multi-couches", "Système de sécurité de niveau militaire"] },
  coffre: { icone: "🔐", txt: ["Pas de coffre, juste la caisse", "Un petit coffre-fort", "Un coffre-fort scellé au sol", "Une salle des coffres", "Une chambre forte blindée", "Une chambre forte de haute sécurité"] },
};
const NIV_POLICE = { village: [0, 1], bourg: [1, 2], route: [1, 3], ville: [2, 3], grande: [3, 4], capitale: [4, 5] };
const MINUTES_POLICE = [22, 14, 9, 6, 4, 2.5];
const TYPES_CIBLES = [
  // ---- niveau 1 : la campagne
  { t: 1, type: "Épicerie de village", de: "d'une épicerie", lieu: "village", m: 0.8, recel: 0, niv: { gardes: [0, 1], cameras: [0, 1], alarme: [0, 1], coffre: [0, 1] },
    nom: () => choix(["Épicerie du Centre", "Épicerie de la Place", `Épicerie Chez ${prenom()}`, "Le Petit Panier", "Alimentation générale " + nomFamille()]),
    ambiance: ["Le gérant, 72 ans, compte sa caisse tous les soirs à 19 h pile.", "Le chien du patron dort derrière le comptoir. Il a l'air vieux. Très vieux.", "Seul commerce à 20 km à la ronde : tout le village y passe."] },

function genererCible(t) {
  const type = choix(TYPES_CIBLES.filter(c => c.t === t));
  const niv = {};
  for (const k of Object.keys(SECU)) niv[k] = randInt(type.niv[k][0], type.niv[k][1]);
  niv.police = randInt(...NIV_POLICE[type.lieu]);
  const lieu = type.lieuFixe || ({ village: village, bourg: village, route: () => "en rase campagne", ville: () => choix(VILLES), grande: () => choix(GRANDES_VILLES) }[type.lieu])();
  const butin = BUTIN_MOYEN(t) * type.m * rand(0.65, 1.45);
  const estimation = butin * rand(0.75, 1.25); // l'estimation n'est jamais exacte
  return {
    id: Math.random().toString(36).slice(2, 10), t, type: type.type, de: type.de, nom: type.nom(), lieu, niv, butin, recel: type.recel,
    butinMin: arrondiPrix(estimation * 0.7), butinMax: arrondiPrix(estimation * 1.3),
    minutesPolice: Math.max(2, Math.round(MINUTES_POLICE[niv.police] * rand(0.8, 1.25))),
    gendarmerie: type.lieu === "village" || type.lieu === "bourg" || type.lieu === "route",
    ambiance: choix(type.ambiance),
  };
}
// Les trois cibles proposées : une plus petite (s'il y en a), une à son niveau, une plus grosse (le « gros coup »)
function proposerCibles(niveau) {
  const tiers = [Math.max(1, niveau - 1), niveau, Math.min(NIVEAU_MAX, niveau + 1)];
  if (niveau === 1) tiers[0] = 1;
  return tiers.map(genererCible);
}

      if (obj.piratage && obj.piratage.panne) dire(`Le ${obj.piratage.nom.toLowerCase()} plante au pire moment.`, "mauvais");
      const ctrl = eq.pirate ? 0.6 * eff("pirate") + 0.4 * qualite(obj.piratage) : 0.15 * qualite(obj.piratage);
      coupees = chance(epreuve(ctrl, diff("cameras")));
      const pi = a("pirate", "Quelqu'un");
      dire(coupees ? choix([`${pi} met les caméras en boucle.`, `${pi} pirate le réseau : les écrans affichent une image figée.`, `${pi} coupe les caméras en quelques clics.`, `Les caméras filment maintenant un couloir vide d'hier soir. Merci ${pi}.`])
        : choix([`${pi} n'arrive pas à couper les caméras.`, `${pi} tape frénétiquement sur son clavier… sans résultat. Les caméras tournent toujours.`, `Les caméras résistent à ${pi}.`]), coupees ? "bon" : "mauvais");
    }
    const fausse = infosFausses.find(i => i.info === "cameras");
    if (fausse) dire("Le plan des caméras était faux : il y en a une de plus, juste au-dessus de la porte.", "mauvais");
    const discret = membres.some(m => aLeTrait(m.r, "discret")) ? 0.8 : 1;
    const pRepere = coupees ? 0.04 : diff("cameras") * (1 - 0.4 * (vehicule ? vehicule.discretion : 0.3)) * (1 - 0.3 * chef) * discret;
    if (chance(pRepere)) { alerte += 0.3; dire(choix(["Une caméra filme l'équipe qui se gare. Quelque part, quelqu'un regarde l'écran…", "Le voyant rouge d'une caméra s'allume. Mauvais signe.", "Un agent de surveillance repère des silhouettes sur son écran."]), "mauvais"); }
    else dire(choix(["Personne ne remarque l'équipe.", "La rue est déserte. Parfait.", "Un passant promène son chien, sans un regard.", "Pas un chat dans la rue.", "Les cagoules sont enfilées dans un angle mort."]), "bon");
  } else dire(choix(["Aucune caméra en vue. L'équipe se gare tranquillement.", "Pas la moindre caméra. On aurait presque honte.", "Aucune caméra : juste un vieux lampadaire qui clignote."]), "bon");
  t += 1;

  // ---- Entrée
  phase("L'entrée");
  const armes = obj.armes || null;
  const gachette = quelquun("gachette");
  if (L.gardes > 0) {
    if (infosFausses.find(i => i.info === "gardes")) dire("Les horaires des vigiles étaient faux : il y a du monde en plus.", "mauvais");
    if (armes && armes.panne) dire(`Les ${armes.nom.toLowerCase()} posent problème : ${armes.nom.startsWith("Répliques") ? "l'une d'elles a perdu son canon en plastique" : "une arme s'enraye dès le début"}.`, "mauvais");
    const attaque = 0.6 * eff("grosbras") + 0.4 * qualite(armes) + 0.1 * chef;
    const ok = chance(epreuve(attaque, diff("gardes")));
    const cible_ = ["", "le patron", "le vigile", "les deux vigiles", "l'équipe de sécurité", "les gardes d'élite"][L.gardes], gb = a("grosbras", "L'équipe");
    if (ok) dire(choix([`${gb} maîtrise ${cible_} sans un bruit.`, `${gb} neutralise ${cible_} en quelques secondes.`, `Face à ${gb}, ${cible_} n'oppose aucune résistance.`, `${gb} s'occupe de ${cible_}. Tout le monde au sol, personne ne bouge.`]).replace("de le ", "du ").replace("de les ", "des ").replace(/^le /, "Le ").replace(/^les /, "Les ").replace(/^l'/, "L'"), "bon");
    else {
      alerte += 0.4;
      dire(choix([`${gb} n'arrive pas à maîtriser tout le monde. Quelqu'un hurle.`, `${gb} se fait bousculer. Ça crie de partout.`, `Un garde résiste à ${gb}. Le ton monte.`, `Un client s'échappe par la porte de derrière pendant que ${gb} regarde ailleurs.`]), "mauvais");
      if (armes && chance(armes.violence * 0.6 + (gachette ? 0.3 : 0))) {
        violence = true; alerte = 1;
        const blesse = chance(0.45) ? choix(membres) : null;
        if (blesse) blesse.blesse = true;
        dire(`Coups de feu !${blesse ? ` ${blesse.r.court} est touché${blesse.r.sexe === "f" ? "e" : ""} à la jambe.` : " Un garde est blessé."} Ça vient de devenir très sérieux.`, "mauvais");
      }
    }
  } else dire(L.coffre === 0 && L.alarme === 0 ? "Personne pour résister. Ça va être rapide." : "Personne pour surveiller. L'équipe entre sans difficulté.", "bon");
  if (!violence && gachette && armes && chance(0.25)) {
    violence = true; alerte += 0.4;
    dire(`${gachette.r.court} tire en l'air « pour se faire respecter ». Bravo.`, "mauvais");
  }
  t += 2;

  // ---- Alarme
  if (L.alarme > 0) {
    let attaque = eq.pirate ? 0.6 * eff("pirate") + 0.4 * qualite(obj.piratage) : 0.15 * qualite(obj.piratage);
    const code = infos.find(i => i.info === "alarme");
    let p = epreuve(attaque, diff("alarme"));
    if (code && code.vraie) p = clamp(p + 0.25, 0, 0.98);
    if (code && !code.vraie) dire("Le code de l'alarme acheté… ne marche pas.", "mauvais");
    const pi = a("pirate", "Par miracle, l'équipe");
    if (chance(p)) dire(code && code.vraie ? "Le code de l'alarme fonctionne. Silence total." : choix([`${pi} neutralise l'alarme.`, `${pi} désactive l'alarme. Silence total.`, `L'alarme est coupée. ${pi} lève le pouce.`, `${pi} court-circuite le boîtier. Le voyant passe au vert.`]), "bon");
    else { tPolice = t; alerte = Math.max(alerte, 0.7); dire(choix(["L'alarme se déclenche ! La police est prévenue.", "Une sirène hurle dans tout le bâtiment ! La police est prévenue.", "Le boîtier émet trois bips… puis l'alarme part. La police est prévenue."]), "mauvais"); }
  }
  if (tPolice === null && alerte >= 0.6 && chance(alerte)) {
    tPolice = t;
    dire(L.alarme > 0 ? "Un employé a eu le temps d'appuyer sur le bouton d'alerte." : "Un client s'est enfui et appelle la police avec son portable.", "mauvais");
  }
  if (tPolice !== null) dire(`${cible.gendarmerie ? "Gendarmes" : "Police"} attendus dans environ ${minutesPolice} min.`, "info");
  t += 1;

  // la police arrive-t-elle pendant qu'on est encore à l'intérieur ?
  const avance = eq.guetteur ? 1 + 3 * eff("guetteur") : 0;
  function policeArrive(duree) {
    if (arrivee() >= t + duree) return false;
    if (eq.guetteur && chance(0.3 + 0.6 * eff("guetteur"))) {
      dire(`${eq.guetteur.court} à la radio : « Les flics arrivent ! On dégage, MAINTENANT ! »`, "mauvais");
      t = Math.max(t, arrivee() - avance); fuiteAnticipee = true;
    } else {
      t = Math.max(t, arrivee());
      dire(eq.guetteur ? `${eq.guetteur.court} n'a rien vu venir. Les sirènes ! La police est déjà là !` : "Les sirènes ! La police est déjà devant la porte !", "mauvais");
      surpris = true;
    }
    return true;
  }

  // ---- Coffre
  let coffreOuvert = L.coffre === 0;
  if (L.coffre > 0) {
    phase("Le coffre");
    const ouv = obj.ouverture || null;
    if (infosFausses.find(i => i.info === "coffre")) dire("Le modèle du coffre ne correspond pas du tout à ce qu'on t'a vendu.", "mauvais");
    if (ouv && ouv.panne) dire(`${ouv.nom} rend l'âme au bout de deux minutes.`, "mauvais");
    if (!eq.perceur) dire(ouv ? "Personne ne sait vraiment se servir du matériel. On tente quand même." : "Personne pour ouvrir le coffre, et rien pour le forcer. On tape dessus.", "mauvais");
    else if (!ouv) dire(`${eq.perceur.court} n'a que ses mains et un tournevis.`, "mauvais");
    const attaque = eq.perceur ? 0.55 * eff("perceur") + 0.45 * qualite(ouv) : 0.25 * qualite(ouv);
    const reussi = chance(epreuve(attaque, diff("coffre")));
    const duree = (2 + 2.5 * L.coffre) * (1.5 - 0.8 * attaque) * rand(0.85, 1.15);
    if (policeArrive(duree)) coffreOuvert = reussi && !fuiteAnticipee && chance(0.3);
    else {
      t += duree; coffreOuvert = reussi;
      const co = ["", "le petit coffre-fort", "le coffre-fort", "la salle des coffres", "la chambre forte", "la chambre forte"][L.coffre], pc = a("perceur", "L'équipe"), d = Math.round(duree);
      dire(reussi ? choix([`${pc} ouvre ${co} en ${d} min.`, `Clic. Au bout de ${d} min, ${co} cède.`, `${pc} vient à bout de ${co} en ${d} min.`, `${d} minutes de sueur, et ${co} s'ouvre enfin.`])
        : choix([`Au bout de ${d} min, ${pc} abandonne : le coffre résiste.`, `${d} minutes perdues : le coffre n'a même pas une rayure.`, `${pc} jette ses outils par terre. Le coffre a gagné.`]), reussi ? "bon" : "mauvais");
    }
  }

  // ---- Butin
  phase("Le butin");
  let frac;
  if (surpris) frac = coffreOuvert ? rand(0.15, 0.35) : rand(0.02, 0.08);
  else if (fuiteAnticipee) frac = coffreOuvert ? rand(0.2, 0.45) : rand(0.03, 0.1);
  else {
    if (infos.find(i => i.info === "butin")) dire(bonusButin > 0 ? "L'informateur avait raison : l'argent est exactement là où il l'a dit." : "Le magot n'est pas là où l'informateur l'a dit. On cherche…", bonusButin > 0 ? "bon" : "mauvais");
    frac = coffreOuvert ? clamp(0.65 + bonusButin + 0.12 * chef + rand(-0.12, 0.12), 0.05, 1) : (L.coffre > 0 ? rand(0.05, 0.14) : clamp(0.6 + bonusButin + 0.1 * chef + rand(-0.15, 0.15), 0.05, 1));
    if (L.coffre > 0 && !coffreOuvert) dire("Sans le coffre, il ne reste que la caisse et ce qui traîne.", "mauvais");
    const duree = 2 + 3 * frac * (1 - 0.3 * chef);
    if (policeArrive(duree)) frac *= surpris ? 0.4 : 0.6;
    else t += duree;
  }
  const capacite = vehicule ? 0.3 + 0.75 * vehicule.coffre : 0.2;
  if (frac > capacite) { frac = capacite; dire(vehicule ? "Le coffre de la voiture est plein : on abandonne une partie du butin." : "À pied, on ne peut pas tout porter. On laisse une partie du butin.", "mauvais"); }
  const butinEmporte = cible.butin * frac;
  dire(`Butin dans les sacs : environ ${euros(butinEmporte)}.`, "info");

  // ---- Fuite
  phase("La fuite");
  const policeAlertee = tPolice !== null;
  const policeSurPlace = policeAlertee && t >= arrivee();
  const ordre = ["chauffeur", "chef", "perceur", "pirate", "grosbras", "logisticien", "guetteur"];
  const tries = membres.slice().sort((x, y) => ordre.indexOf(x.role) - ordre.indexOf(y.role));
  const places = vehicule ? vehicule.places : 0;
  const voiture = tries.slice(0, places), aPied = tries.slice(places);
  if (vehicule && aPied.length) dire(`Pas assez de places : ${aPied.map(m => m.r.court).join(", ")} ${aPied.length > 1 ? "partent" : "part"} à pied.`, "mauvais");
  let voitureOk = false;
  if (vehicule && voiture.length) {
    if (vehicule.panne) dire(choix([`${majuscule(leV(vehicule))}${vehicule.nom.toLowerCase()} tousse, cale… et redémarre enfin. De précieuses secondes perdues.`, `Le moteur ${duV(vehicule)}${vehicule.nom.toLowerCase()} fume. Ça roule, mais au ralenti.`, `${majuscule(leV(vehicule))}${vehicule.nom.toLowerCase()} refuse de démarrer pendant de longues secondes.`]), "mauvais");
    if (!eq.chauffeur) dire(`${voiture[0].r.court} prend le volant, sans grande conviction.`, "mauvais");
    const conduite = eq.chauffeur ? eff("chauffeur") : 0.1;
    const vitesse = vehicule.vitesse * (vehicule.panne ? 0.25 : 1);
    if (infos.find(i => i.info === "police")) dire(bonusFuite > 0 ? "L'itinéraire de fuite acheté est parfait : pas une patrouille." : "L'itinéraire de fuite mène droit vers un chantier. Demi-tour !", bonusFuite > 0 ? "bon" : "mauvais");
    let p;
    if (!policeAlertee) p = clamp(0.82 + 0.15 * conduite + bonusFuite * 0.3 - (vehicule.panne ? 0.25 : 0), 0.05, 0.99);
    else {
      const attaque = 0.55 * conduite + 0.35 * vitesse + 0.1 * eff("guetteur") + bonusFuite;
      const defense = niveauPolice / 5 * 0.6 + (policeSurPlace ? 0.25 : 0) + (violence ? 0.15 : 0) + (surpris ? 0.15 : 0);
      p = epreuve(attaque, defense);
    }
    voitureOk = chance(p);
    if (voitureOk) {
      const ch = a("chauffeur", voiture[0].r.court);
      dire(policeAlertee ? choix([`${ch} sème la police dans les petites rues. Personne ne suit.`, `${ch} coupe par un parking souterrain. Les sirènes s'éloignent.`, `Course-poursuite… et ${ch} gagne. La police a perdu leur trace.`, `${ch} éteint les phares et se glisse dans une ruelle. Les voitures de police passent tout droit.`])
        : choix([`Fuite tranquille. ${ch} respecte même les limitations de vitesse.`, `${ch} se mêle à la circulation. Personne ne s'est rendu compte de rien.`, `Retour à la planque sans un regard en arrière.`, `${ch} met la radio. Personne ne les suit.`]), "bon");
    } else {
      dire(policeAlertee ? choix(["Barrage de police au bout de la rue ! La voiture est coincée.", "Deux voitures de police coupent la route. Plus d'issue.", "Un camion bloque la rue, la police arrive derrière. Coincés."]) : choix([`${a("chauffeur", voiture[0].r.court)} grille un feu rouge… devant une voiture de police.`, "Contrôle routier de routine. Pas de chance.", "Un pneu éclate en pleine ligne droite. Une patrouille s'arrête « pour aider »."]), "mauvais");
      for (const m of voiture) {
        const pPris = 0.72 - (aLeTrait(m.r, "sangfroid") ? 0.15 : 0) + (m.blesse ? 0.2 : 0);
        if (chance(pPris)) { m.statut = "arrete"; dire(`${m.r.court} est arrêté${m.r.sexe === "f" ? "e" : ""}.`, "mauvais"); }
        else { m.aPied = true; dire(`${m.r.court} saute de la voiture et s'enfuit à pied${chance(0.6) ? " avec un sac" : ""}.`, "bon"); }
      }
    }
  }
  for (const m of aPied) {
    const p = (policeAlertee ? 0.3 + 0.35 * m.r.s : 0.88) * (m.blesse ? 0.6 : 1);
    if (chance(p)) dire(`${m.r.court} disparaît dans la nature, à pied.`, "bon");
    else { m.statut = "arrete"; dire(`${m.r.court} se fait rattraper, à pied, trois rues plus loin.`, "mauvais"); }
  }
  // l'argent ramené : la voiture garde les sacs ; sinon, chacun repart avec ce qu'il porte
  let recupere;
  if (vehicule && voiture.length) {
    if (voitureOk) recupere = butinEmporte;
    else { const fuyards = voiture.filter(m => m.statut === "libre").length; recupere = butinEmporte * fuyards / voiture.length * 0.5; }
  } else { const libres = membres.filter(m => m.statut === "libre").length; recupere = butinEmporte * libres / Math.max(1, membres.length); }

  // ---- Le partage
  phase("Le partage");
  const trahisons = [];
  for (const m of membres) {
    if (m.statut !== "libre" || recupere <= 0) continue;
    const p = aLeTrait(m.r, "loyal") ? 0 : aLeTrait(m.r, "endette") ? 0.4 : 0.03;
    if (chance(p)) {
      const part = recupere * rand(0.3, 0.6) / Math.max(1, membres.filter(x => x.statut === "libre").length) * 1.5;
      recupere -= part; m.statut = "disparu"; m.vol = part; trahisons.push(m);
      dire(`${m.r.court} disparaît avec ${euros(part)}. Plus de nouvelles, numéro coupé.`, "mauvais");
    }
  }
  const recel = recupere * cible.recel;
  if (recel > 0) dire(`Le receleur prend sa part pour écouler la marchandise : ${euros(recel)}.`, "info");
  const gain = Math.max(0, recupere - recel);
  const cout = depenses(etapes);
  // garde à vue : les arrêtés parlent-ils ?
  let saisie = 0, balance = null;
  for (const m of membres.filter(m => m.statut === "arrete")) {
    const p = 0.12 + (aLeTrait(m.r, "bavard") ? 0.4 : 0) - (aLeTrait(m.r, "loyal") ? 0.12 : 0) - (aLeTrait(m.r, "sangfroid") ? 0.05 : 0) + (violence ? 0.1 : 0);
    if (chance(p)) { balance = m; break; }
  }
  const argentApres = argentAvant - cout + gain;
  if (balance) {
    saisie = Math.round(argentApres * 0.3);
    dire(`${balance.r.court} a craqué en garde à vue et a donné ton nom. Saisie sur tes comptes : ${euros(saisie)}.`, "mauvais");
  } else if (membres.some(m => m.statut === "arrete")) dire("Les arrêtés n'ont rien dit. Pour l'instant.", "neutre");
  if (gain > 0) dire(`Argent ramené : ${euros(gain)}.`, gain >= cout ? "bon" : "info");
  else dire("Personne n'a rien ramené.", "mauvais");

  // ---- Verdict
  const nbArretes = membres.filter(m => m.statut === "arrete").length;
  let issue;
  if (gain <= 0 && nbArretes === membres.length) issue = { titre: "Fiasco total", c: "rouge", txt: "Toute l'équipe dort au poste ce soir. Et tu as tout perdu." };
  else if (gain <= 0) issue = { titre: "Échec", c: "rouge", txt: nbArretes ? "Des arrestations, et pas un euro de ramené." : "Tout le monde s'en sort… mais les mains vides." };
  else if (nbArretes > 0 && gain < cout) issue = { titre: "Fiasco… presque", c: "rouge", txt: "C'est raté, mais quelqu'un a réussi à s'enfuir avec un peu d'argent." };
  else if (nbArretes > 0) issue = { titre: "Réussite, avec de la casse", c: "or", txt: "L'argent est là, mais certains ne reviendront pas avant un moment." };
  else if (gain < cout) issue = { titre: "Réussite… pour des miettes", c: "or", txt: "Personne n'est arrêté, mais le butin ne couvre même pas les frais." };
  else if (gain >= cout * 2.5 && !trahisons.length) issue = { titre: "Coup parfait", c: "vert", txt: "Tout le monde est libre, et les sacs sont pleins. On en parlera longtemps dans le milieu." };
  else issue = { titre: "Réussite", c: "vert", txt: "Le coup est rentable, et toute l'équipe est libre." };
  const reussi = gain >= cout;

  return {
    log, issue, reussi, cout, gain, saisie, recel, butinEmporte, recupereAvantRecel: recupere + 0, argentAvant, argentApres: argentApres - saisie,
    membres: membres.map(m => ({ role: m.role, id: m.r.id, statut: m.statut, blesse: m.blesse, vol: m.vol || 0 })),
    objets: Object.values(obj).map(o => ({ boutique: o.boutique, nom: o.nom, panne: o.panne, facteur: o.facteur, rel: o.rel })),
    infos: infos.map(i => ({ nom: i.nom, vraie: i.vraie, source: i.source, facteur: i.facteur })),
    trahi: trahisons.length > 0, violence,
  };
}

/* ===== SAUVEGARDE (dans ce navigateur) ===== */
const CLE = "braquage-partie-v1";
let S = null; // l'état de la partie
function sauver() { try { localStorage.setItem(CLE, JSON.stringify(S)); } catch (e) {} }
function charger() { try { const x = JSON.parse(localStorage.getItem(CLE)); return x && x.argent !== undefined ? x : null; } catch (e) { return null; } }
function nouvellePartie() {
  S = { argent: ARGENT_DEPART, niveau: 1, coup: 1, ecran: "cibles", cibles: proposerCibles(1), preps: {}, cibleId: null, etape: 0, resultat: null,
    stats: { coups: 0, reussis: 0, meilleur: 0, totalGagne: 0, niveauMax: 1 }, legende: false };
  sauver();
}

/* ===== INTERFACE ===== */
const app = document.getElementById("app");
const $ = id => document.getElementById(id);
let minuteurLog = null;
const cibleCourante = () => S && S.cibles.find(c => c.id === S.cibleId);
const etapesCourantes = () => S.preps[S.cibleId];

function majBarre() {
  const b = $("barre");
  if (!S || S.ecran === "accueil") { b.hidden = true; return; }
  b.hidden = false;
  let argent = S.argent;
  if (S.ecran === "prep") argent = S.argent - depenses(etapesCourantes());
  if (S.ecran === "braquage" && S.resultat) argent = S.resultat.argentAvant - S.resultat.cout;
  $("hArgent").textContent = euros(argent);
  $("hNiveau").innerHTML = `Coup ${S.coup} · <span title="Niveau de réputation">★${Math.min(S.niveau, NIVEAU_MAX)}</span>`;
}
function afficher() {
  clearTimeout(minuteurLog);
  if (!S) S = { ecran: "accueil" };
  ({ accueil: ecranAccueil, cibles: ecranCibles, prep: ecranPrep, braquage: ecranBraquage, bilan: ecranBilan, fin: ecranFin })[S.ecran]();
  majBarre();
  dessinerAvatars();
}
function aller(ecran) { S.ecran = ecran; sauver(); afficher(); scrollTo(0, 0); }

// --- accueil
function ecranAccueil() {
  const sauvegarde = charger();
  app.innerHTML = `
  <section class="accueil">
    <h1 class="titre">Braquage</h1>
    <p class="sous">Recrute ton équipe, achète ton matériel, gère ton budget.<br>Et prie pour que personne ne parle.</p>
    ${sauvegarde && sauvegarde.ecran !== "fin" ? `<button class="btn" data-a="continuer">Continuer · coup n°${sauvegarde.coup} · ${euros(sauvegarde.argent)}</button>` : ""}
    <button class="btn ${sauvegarde && sauvegarde.ecran !== "fin" ? "secondaire" : ""}" data-a="nouvelle">Nouvelle partie</button>
    <details class="carte regles">
      <summary><b>Comment jouer</b></summary>
      <p>💰 Tu commences avec ${euros(ARGENT_DEPART)}. Choisis une cible : une petite boutique de village pour commencer, une banque ou une réserve d'or plus tard.</p>
      <p>👥 Pour chaque poste, plusieurs candidats se présentent, avec leur efficacité, leur passé et les rumeurs qui courent sur eux. Leur prix est ferme et suit généralement leur efficacité… mais pas toujours : il y a des bonnes affaires et des arnaques. Et certains défauts ne se découvrent que pendant le coup.</p>

// --- préparation

  const points = etapes.map((e, k) => {
    const ic = e.type === "role" ? ROLES[e.cle].icone : BOUTIQUES[e.cle].icone;
    const passe = e.choix === -1 || (e.cle === "infos" && e.choix !== null && !e.multi.length);
    return `<button class="${etapeFaite(e) ? "fait" : ""} ${passe ? "passe" : ""} ${k === i ? "actif" : ""}" data-a="etape" data-i="${k}" aria-label="${e.type === "role" ? ROLES[e.cle].nom : BOUTIQUES[e.cle].nom}">${ic}</button>`;
  }).join("") + `<button class="${i === etapes.length ? "actif" : ""}" data-a="etape" data-i="${etapes.length}" aria-label="Récapitulatif" ${etapes.every(etapeFaite) ? "" : "disabled style='opacity:.35'"}>📋</button>`;
  let corps;

    const e = etapes[i], dispo = S.argent - depenses(etapes, i);
    const def = e.type === "role" ? ROLES[e.cle] : BOUTIQUES[e.cle];

function vueRecap(c, etapes) {
  const { eq, obj, infos } = equipeDe(etapes);

  for (const b of ["vehicule", "armes", "ouverture", "piratage"]) if (etapes.some(e => e.cle === b)) lignes.push([`${BOUTIQUES[b].icone} ${BOUTIQUES[b].nom}`, obj[b] ? `${obj[b].nom} · ${euros(obj[b].prix)}` : `<span class="muet">rien</span>`]);

}

// --- actions
app.addEventListener("click", ev => { const b = ev.target.closest("[data-a]"); if (b && !b.disabled) action(b.dataset.a, +b.dataset.i); });
$("barre").addEventListener("click", ev => { const b = ev.target.closest("[data-a]"); if (b) action(b.dataset.a); });
function action(a, i) {
  const etapes = S && S.preps && S.cibleId ? etapesCourantes() : null;
  switch (a) {
    case "nouvelle":
      if (charger() && S.ecran === "accueil" && charger().ecran !== "fin" && !confirm("Recommencer une partie ? La partie en cours sera perdue.")) return;
      nouvellePartie(); aller("cibles"); break;
    case "continuer": S = charger(); afficher(); break;
    case "menu": clearTimeout(minuteurLog); S = { ecran: "accueil" }; afficher(); scrollTo(0, 0); break;
    case "cible": {
      const c = S.cibles[i]; S.cibleId = c.id;
      if (!S.preps[c.id]) S.preps[c.id] = construireEtapes(c);
      S.etape = Math.max(0, S.preps[c.id].findIndex(e => !etapeFaite(e)));
      if (S.preps[c.id].every(etapeFaite)) S.etape = S.preps[c.id].length;
      aller("prep"); break;
    }
    case "retourCibles": aller("cibles"); break;
    case "etape": S.etape = i; sauver(); afficher(); scrollTo(0, 0); break;
    case "choisir": { const e = etapes[S.etape]; e.choix = e.choix === i ? null : i; if (e.choix !== null) avancer(); else { sauver(); afficher(); } break; }
    case "passer": etapes[S.etape].choix = -1; avancer(); break;
    case "basculer": { const e = etapes[S.etape]; const k = e.multi.indexOf(i); if (k >= 0) e.multi.splice(k, 1); else e.multi.push(i); e.choix = null; sauver(); afficher(); break; }
    case "suivant": { const e = etapes[S.etape]; e.choix = e.multi.length ? 0 : -1; avancer(); break; }
    case "lancer": {
      const c = cibleCourante();
      if (depenses(etapes) > S.argent) return;
      S.resultat = simuler(c, etapes, S.argent);
      S.logVu = false; aller("braquage"); break;
    }
    case "toutVoir": ecranBraquage.toutVoir(); break;
    case "bilan": {
      if (!S.bilanApplique) appliquerBilan();
      aller("bilan"); break;
    }
    case "coupSuivant": {
      S.coup++; S.cibles = proposerCibles(S.niveau); S.preps = {}; S.cibleId = null; S.etape = 0; S.resultat = null; S.bilanApplique = false;
      aller("cibles"); break;
    }
    case "finPartie": aller("fin"); break;
  }
}
// passe à la prochaine étape pas encore faite (ou au récapitulatif)
function avancer() {
  const etapes = etapesCourantes();
  let k = etapes.findIndex((e, j) => j > S.etape && !etapeFaite(e));
  if (k < 0) k = etapes.findIndex(e => !etapeFaite(e));
  S.etape = k < 0 ? etapes.length : k;
  sauver(); afficher(); scrollTo(0, 0);
}
function appliquerBilan() {
  const R = S.resultat, c = cibleCourante();
  S.niveauAvant = S.niveau;
  S.argent = R.argentApres;
  S.stats.coups++; S.stats.totalGagne += R.gain;
  if (R.reussi) {
    S.stats.reussis++;
    if (c.t >= S.niveau) { if (c.t === NIVEAU_MAX) S.legende = true; S.niveau = Math.min(NIVEAU_MAX, Math.max(S.niveau, c.t + 1)); }
  }
  S.stats.meilleur = Math.max(S.stats.meilleur, R.gain);
  S.stats.niveauMax = Math.max(S.stats.niveauMax, S.niveau);
  S.bilanApplique = true; S.logVu = true;
  sauver();
}

/* ===== PORTRAITS (dessinés au hasard, à partir d'une graine) ===== */
function dessinerAvatars() { document.querySelectorAll("canvas[data-avatar]").forEach(cv => dessinerAvatar(cv, +cv.dataset.avatar, cv.dataset.sexe, +cv.dataset.age)); }
function dessinerAvatar(cv, graine, sexe, age) {
  const R = mulberry32(graine), x = cv.getContext("2d"), k = cv.width / 100;
  const pick = a => a[Math.floor(R() * a.length)];
  x.setTransform(k, 0, 0, k, 0, 0); x.clearRect(0, 0, 100, 100);
  const fond = pick(["#2b2733", "#33291d", "#1f2b2a", "#2d2222", "#232838"]);
  const peau = pick(["#f1c27d", "#e0ac69", "#c68642", "#8d5524", "#ffdbac", "#5c3a21", "#d9a066"]);
  const cheveux = age > 55 && R() < 0.6 ? pick(["#b5b5b5", "#dcdcdc", "#8a8a8a"]) : pick(["#1b1b1b", "#3b2a1a", "#6b4423", "#b8860b", "#2a1a10", "#8b3a1a"]);
  const habit = pick(["#3a3f4b", "#5a2a2a", "#2a4a3a", "#1d1d1d", "#4a4030", "#2c3e66", "#6b5b3a"]);
  const cagoule = R() < 0.06;
  const ell = (cx, cy, rx, ry, c) => { x.fillStyle = c; x.beginPath(); x.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); x.fill(); };
  x.fillStyle = fond; x.fillRect(0, 0, 100, 100);
  const longs = sexe === "f" && R() < 0.65;
  if (longs && !cagoule) { x.fillStyle = cheveux; x.beginPath(); if (x.roundRect) x.roundRect(26, 30, 48, 52, 14); else x.rect(26, 30, 48, 52); x.fill(); }
  ell(50, 104, 40, 30, habit);                       // épaules
  x.fillStyle = peau; x.fillRect(43, 64, 14, 14);    // cou
  ell(50, 48, 21, 26, cagoule ? "#141414" : peau);   // tête
  if (cagoule) { ell(50, 47, 15, 6, peau); }
  // yeux et sourcils
  const yeux = cagoule ? "#111" : "#1d1d1d";
  ell(42, 47, 2.6, 2.8, yeux); ell(58, 47, 2.6, 2.8, yeux);
  if (!cagoule) {
    x.strokeStyle = cheveux; x.lineWidth = 2.2; x.lineCap = "round";
    const sb = R() * 3 - 1.5;
    x.beginPath(); x.moveTo(37, 41 + sb); x.lineTo(46, 40); x.moveTo(54, 40); x.lineTo(63, 41 - sb); x.stroke();
    // nez et bouche
    x.strokeStyle = "rgba(0,0,0,.25)"; x.lineWidth = 1.6; x.beginPath(); x.moveTo(50, 50); x.lineTo(48, 57); x.lineTo(51, 58); x.stroke();
    x.strokeStyle = "#5a2e2e"; x.lineWidth = 2; x.beginPath();
    const sourire = R() * 4 - 1.5; x.moveTo(43, 64); x.quadraticCurveTo(50, 64 + sourire, 57, 64); x.stroke();
    // barbe / moustache
    if (sexe === "m" && R() < 0.4) { x.fillStyle = cheveux; x.globalAlpha = .9; x.beginPath(); x.moveTo(30, 52); x.quadraticCurveTo(32, 76, 50, 76); x.quadraticCurveTo(68, 76, 70, 52); x.quadraticCurveTo(66, 66, 50, 67); x.quadraticCurveTo(34, 66, 30, 52); x.fill(); x.globalAlpha = 1; }
    else if (sexe === "m" && R() < 0.25) { x.fillStyle = cheveux; x.beginPath(); x.ellipse(50, 60.5, 7, 2.2, 0, 0, Math.PI * 2); x.fill(); }
    // cheveux
    const style = R();
    x.fillStyle = cheveux;
    if (sexe === "m" && age > 40 && style < 0.25) { /* chauve */ }
    else { x.beginPath(); x.ellipse(50, 33, 22, 13, 0, Math.PI, 0); x.fill(); x.fillRect(28, 32, 4, 12); x.fillRect(68, 32, 4, 12);
      if (sexe === "f" && !longs && style < 0.5) ell(50, 20, 8, 7, cheveux); }
    // lunettes
    if (R() < 0.25) { x.strokeStyle = "#ddd"; x.lineWidth = 1.6; x.beginPath(); x.arc(42, 47, 6, 0, Math.PI * 2); x.moveTo(64, 47); x.arc(58, 47, 6, 0, Math.PI * 2); x.moveTo(48, 47); x.lineTo(52, 47); x.stroke(); }
    // casquette
    if (R() < 0.15) { x.fillStyle = pick(["#c0392b", "#1e3a5f", "#222", "#556b2f"]); x.beginPath(); x.ellipse(50, 30, 23, 12, 0, Math.PI, 0); x.fill(); x.fillRect(48, 28, 30, 4); }
  }
}

/* ===== VERSION =====
   À chaque changement : on monte VERSION ici et dans version.json (même numéro).
   La page compare régulièrement avec version.json en ligne et propose de se mettre à jour. */
const VERSION = "1.1.0", NOTES = "Textes beaucoup plus variés, jauge d'efficacité pour chaque recrue, possibilité de laisser un poste vide avec ses conséquences, et chances estimées du plan.";
$("version").innerHTML = `<b>v${VERSION}</b> · ${NOTES}`;
const plusRecente = (a, b) => { const x = a.split(".").map(Number), y = b.split(".").map(Number); for (let i = 0; i < 3; i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); return false; };
async function verifierVersion() {
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const v = await r.json();
    if (!v.version || !plusRecente(v.version, VERSION)) return;
    const resume = v.notes ? v.notes.split(/(?<=[.!])\s|\n/)[0].slice(0, 110) : "";
    $("majTexte").textContent = `Nouvelle version disponible (${v.version})${resume ? " : " + resume : ""}`;
    $("majDispo").hidden = false; $("majDispo").dataset.version = v.version;
  } catch (e) {}
}
$("majOk").addEventListener("click", () => { location.href = location.pathname + "?v=" + $("majDispo").dataset.version; });
verifierVersion();
setInterval(verifierVersion, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) verifierVersion(); });

afficher();
</script>
